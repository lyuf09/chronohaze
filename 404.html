  <script>
    (function () {
      try {
        var url = new URL(window.location.href);
        var queryLang = url.searchParams.get("lang");
        var valid = function (value) {
          return value === "zh" || value === "en";
        };
        var defaultLang = (document.documentElement.getAttribute("lang") || "").toLowerCase();
        var defaultSafe = defaultLang.indexOf("en") === 0 ? "en" : "zh";

        if (valid(queryLang)) {
          window.localStorage.setItem("siteLang", queryLang);
          window.localStorage.setItem("chronohaze-lang", queryLang);
          window.__chronohazePreferredLang = queryLang;
          document.documentElement.lang = queryLang === "en" ? "en" : "zh-CN";
          document.documentElement.setAttribute("data-site-lang", queryLang);
          return;
        }

        var storedLang = window.localStorage.getItem("siteLang");
        if (!valid(storedLang)) {
          storedLang = window.localStorage.getItem("chronohaze-lang");
        }
        if (!valid(storedLang)) {
          return;
        }

        window.__chronohazePreferredLang = storedLang;
        document.documentElement.lang = storedLang === "en" ? "en" : "zh-CN";
        document.documentElement.setAttribute("data-site-lang", storedLang);

        if (storedLang !== defaultSafe) {
          url.searchParams.set("lang", storedLang);
          window.location.replace(url.toString());
        }
      } catch (_err) {}
    })();
  </script>

      --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg-0);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text-strong);

        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 52%, #090b0d 100%);

    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -12%;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background:
        radial-gradient(34% 28% at 24% 36%, rgba(124, 147, 184, 0.15), transparent 72%),
        radial-gradient(30% 24% at 78% 68%, rgba(83, 101, 131, 0.16), transparent 78%);
      filter: blur(56px);
      opacity: 0.68;
      animation: mistDrift 18s ease-in-out infinite alternate;

    body::after {

        radial-gradient(circle at 16% 26%, rgba(255, 255, 255, 0.06) 0.75px, transparent 1px),

      opacity: 0.26;
    }

    .page-shell {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .js .page-shell {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 660ms var(--motion-ease), transform 660ms var(--motion-ease);
    }

    .js .page-shell.is-ready {
      opacity: 1;
      transform: none;
    }

    .topbar,
    .footer-line,
    .hero-wrap {
      width: min(1080px, calc(100% - 56px));

    .lang-btn:hover {

    .lang-btn.active {

    .action-grid {

    .action-link {

    .footer-line::before {

      width: min(100%, 1080px);

      background: linear-gradient(90deg, transparent 0%, rgba(138, 160, 200, 0.08) 14%, rgba(138, 160, 200, 0.18) 50%, rgba(138, 160, 200, 0.08) 86%, transparent 100%);

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid rgba(138, 160, 200, 0.72);
      outline-offset: 3px;

    @keyframes mistDrift {
      0% {
        transform: translate3d(-1.2%, -0.6%, 0) scale(1);
      }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;

      .js .page-shell {

    @media (max-width: 860px) {

    @media (max-width: 640px) {
      .topbar,
      .footer-line,

<body>

          <nav class="action-grid" aria-label="Primary recovery links">
            <a class="action-link" id="homeLink" href="index.html" data-i18n="home">回到主页</a>
            <a class="action-link" id="secondaryPrimaryLink" href="academic.html" data-i18n="mathOrResearch">学术</a>

          </nav>

          <div class="secondary-links" aria-label="Secondary recovery links">
            <a class="secondary-link" href="photography.html" data-i18n="photo">摄影</a>

      <span data-i18n="footer">先回到起点，再继续前行。</span>
    </footer>

  <script>
    (function () {
      const translations = {
        zh: {
          langAttr: 'zh-CN',
          pageTitle: '404 | Chronohaze',
          pageDescription: 'Chronohaze 的 404 页面：回到主页、学术、项目或 CV。',
          title: '这页似乎不在这里',
          subtitle: '你要找的内容可能已经移动、改名，或暂时未被收录。',
          home: '回到主页',
          mathOrResearch: '学术',
          secondaryPrimaryHref: 'academic.html',
          projects: '项目',
          cv: 'CV',
          photo: '摄影',
          music: '音乐',
          footer: '先回到起点，再继续前行。',
          kicker: '404'
        },
        en: {
          langAttr: 'en',
          pageTitle: '404 | Chronohaze',
          pageDescription: 'Chronohaze 404 page: return to home, academic, projects, or CV.',
          title: 'This page seems to be elsewhere',
          subtitle: 'The content you were looking for may have moved, been renamed, or is not available here.',
          home: 'Home',
          mathOrResearch: 'Academic',
          secondaryPrimaryHref: 'academic.html',
          projects: 'Projects',
          cv: 'CV',
          photo: 'Photography',
          music: 'Music',
          footer: 'Return to the beginning, then continue.',
          kicker: '404'
        }
      };

      const storageKeys = ['siteLang', 'chronohaze-lang'];
      const langButtons = Array.from(document.querySelectorAll('.lang-btn'));
      const shell = document.getElementById('pageShell');
      const pageTitle = document.querySelector('title');
      const pageDescription = document.querySelector('meta[name="description"]');
      const secondaryPrimaryLink = document.getElementById('secondaryPrimaryLink');

      function writeLang(lang) {
        storageKeys.forEach(function (key) {
          try { localStorage.setItem(key, lang); } catch (error) {}
        });
      }

      function resolveInitialLang() {
        for (const key of storageKeys) {
          try {
            const value = localStorage.getItem(key);
            if (value === 'zh' || value === 'en') return value;
          } catch (error) {}
        }
        return document.documentElement.lang && document.documentElement.lang.toLowerCase().startsWith('en') ? 'en' : 'zh';
      }

      function applyLang(lang) {
        const copy = translations[lang] || translations.zh;
        document.documentElement.lang = copy.langAttr;
        if (pageTitle) pageTitle.textContent = copy.pageTitle;
        if (pageDescription) pageDescription.setAttribute('content', copy.pageDescription);
        document.querySelectorAll('[data-i18n]').forEach(function (node) {
          const key = node.getAttribute('data-i18n');
          if (copy[key]) node.textContent = copy[key];
        });
        secondaryPrimaryLink.setAttribute('href', copy.secondaryPrimaryHref);
        langButtons.forEach(function (button) {
          button.classList.toggle('active', button.dataset.lang === lang);
          button.setAttribute('aria-pressed', button.dataset.lang === lang ? 'true' : 'false');
        });
        writeLang(lang);
      }

      langButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          applyLang(button.dataset.lang || 'zh');
        });
      });

      applyLang(resolveInitialLang());
      requestAnimationFrame(function () {
        shell.classList.add('is-ready');
      });
    })();
  </script>
