name: Site Build & Checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "25 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: site-checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package.json"

      - name: Install build dependencies
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          if [ -f package-lock.json ]; then
            npm ci --no-audit --prefer-offline
          else
            npm install --package-lock-only --no-audit --prefer-offline
            npm ci --no-audit --prefer-offline
          fi
          sudo apt-get update
          sudo apt-get install -y libavif-bin fonts-noto-cjk
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Build generated data and media manifests
        env:
          CHRONOHAZE_MEDIA_MANIFEST_ONLY: "1"
        run: bash scripts/build_site_generated_assets.sh

      - name: Run consistency and drift checks
        run: bash scripts/check_all.sh

      - name: Run runtime smoke (Playwright)
        env:
          CHRONOHAZE_SMOKE_PROJECTS: ${{ github.event_name == 'schedule' && 'chromium,webkit,iphone13' || 'chromium' }}
        run: bash scripts/run_playwright_smoke.sh

      - name: Validate structured data JSON-LD (Playwright)
        run: bash scripts/run_playwright_structured_data_check.sh
