name: Site Build & Checks

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          npm install
          sudo apt-get update
          sudo apt-get install -y libavif-bin fonts-noto-cjk
          npx playwright install --with-deps chromium webkit

      - name: Build generated data and media assets
        run: bash scripts/build_site_generated_assets.sh

      - name: Run consistency and drift checks
        run: bash scripts/check_all.sh

      - name: Run runtime smoke (Playwright)
        run: bash scripts/run_playwright_smoke.sh

      - name: Validate structured data JSON-LD (Playwright)
        run: bash scripts/run_playwright_structured_data_check.sh
