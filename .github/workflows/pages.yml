name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          npm install
          sudo apt-get update
          sudo apt-get install -y libavif-bin fonts-noto-cjk
          npx playwright install --with-deps chromium webkit

      - name: Build generated data and media assets
        run: bash scripts/build_site_generated_assets.sh

      - name: Run site checks
        run: bash scripts/check_all.sh

      - name: Run runtime smoke (Playwright, non-blocking for deploy)
        continue-on-error: true
        run: bash scripts/run_playwright_smoke.sh

      - name: Validate structured data JSON-LD (Playwright, non-blocking for deploy)
        continue-on-error: true
        run: bash scripts/run_playwright_structured_data_check.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' --exclude='./node_modules' --exclude='./.DS_Store' -cf - . | (cd _site && tar -xf -)
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
