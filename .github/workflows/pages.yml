name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ripgrep

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build generated data and run pre-deploy consistency checks
        run: bash scripts/check_all.sh

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./_site' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./scripts' \
            --exclude='./docs' \
            --exclude='./package.json' \
            --exclude='./playwright.smoke.config.js' \
            --exclude='./.DS_Store' \
            -cf - . | (cd _site && tar -xf -)
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
