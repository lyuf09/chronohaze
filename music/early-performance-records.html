  <script>
    (function () {
      var buttons = Array.from(document.querySelectorAll(".performance-set-thumb"));
      var dialog = document.querySelector(".performance-lightbox");
      var image = dialog.querySelector("img");
      var caption = dialog.querySelector("figcaption");
      var index = 0;

      function showFrame(nextIndex) {
        index = (nextIndex + buttons.length) % buttons.length;
        var button = buttons[index];
        image.src = button.getAttribute("data-full");
        image.alt = button.getAttribute("data-alt");
        caption.textContent = String(index + 1).padStart(2, "0") + " / " + String(buttons.length).padStart(2, "0");
      }

      buttons.forEach(function (button, buttonIndex) {
        button.addEventListener("click", function () {
          showFrame(buttonIndex);
          dialog.showModal();
        });
      });

      dialog.querySelector(".performance-lightbox-close").addEventListener("click", function () { dialog.close(); });
      dialog.querySelector(".performance-lightbox-prev").addEventListener("click", function () { showFrame(index - 1); });
      dialog.querySelector(".performance-lightbox-next").addEventListener("click", function () { showFrame(index + 1); });
      dialog.addEventListener("click", function (event) { if (event.target === dialog) dialog.close(); });
      document.addEventListener("keydown", function (event) {
        if (!dialog.open) return;
        if (event.key === "ArrowLeft") showFrame(index - 1);
        if (event.key === "ArrowRight") showFrame(index + 1);
      });
    })();
  </script>
