<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta id="chronohaze-security-policy" http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self'; frame-src 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <style id="chronohaze-critical-loader-style">
    html.chronohaze-critical-loading,
    html.chronohaze-critical-loading body {
      min-height: 100%;
      background: #10141b;
    }

    html.chronohaze-critical-loading body {
      margin: 0;
      overflow: hidden;
    }

    html.chronohaze-critical-loading body > :not(.chronohaze-loader) {
      visibility: hidden !important;
    }

    html.chronohaze-critical-loading::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      background:
        linear-gradient(90deg, rgba(138, 160, 200, 0.09) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, rgba(138, 160, 200, 0.07) 0 1px, transparent 1px 100%),
        linear-gradient(180deg, rgba(13, 17, 24, 0.992) 0%, rgba(19, 24, 33, 0.992) 55%, rgba(13, 17, 24, 0.996) 100%);
      background-size: 54px 54px, 54px 54px, 100% 100%;
    }

    html.chronohaze-critical-loading::after {
      content: "chronohaze.space";
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 2147483001;
      width: min(500px, calc(100vw - 40px));
      padding: 30px 32px;
      transform: translate(-50%, -50%);
      white-space: pre-line;
      color: rgba(232, 234, 237, 0.9);
      font: 300 clamp(22px, 3.2vw, 34px)/1.48 "Cormorant Garamond", "Noto Serif SC", "Songti SC", "STSong", serif;
      letter-spacing: 0.055em;
      border: 1px solid rgba(154, 172, 204, 0.3);
      border-radius: 0;
      background: linear-gradient(180deg, rgba(20, 25, 34, 0.84) 0%, rgba(13, 17, 24, 0.82) 100%);
      box-shadow: 0 24px 58px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.045);
    }

    html[lang^="zh"].chronohaze-critical-loading:not(.chronohaze-critical-loading-mobile)::after {
      content: "chronohaze.space\A 页面加载中";
    }

    html[lang^="en"].chronohaze-critical-loading:not(.chronohaze-critical-loading-mobile)::after {
      content: "chronohaze.space\A Loading";
    }

    html.chronohaze-critical-loading-mobile body {
      overflow: auto;
    }

    html.chronohaze-critical-loading-mobile body > :not(.chronohaze-loader) {
      visibility: visible !important;
    }

    html.chronohaze-critical-loading-mobile::before {
      background: linear-gradient(180deg, rgba(13, 17, 24, 0.18) 0%, rgba(19, 24, 33, 0.22) 100%);
      pointer-events: none;
    }

    html.chronohaze-critical-loading-mobile::after {
      content: "chronohaze.space";
      left: 16px;
      top: 16px;
      width: auto;
      max-width: calc(100vw - 32px);
      padding: 10px 12px;
      transform: none;
      white-space: normal;
      color: rgba(232, 234, 237, 0.78);
      font: 400 12px/1.3 "Cormorant Garamond", "Noto Serif SC", "Songti SC", "STSong", serif;
      letter-spacing: 0.18em;
      border: 1px solid rgba(154, 172, 204, 0.18);
      background: rgba(16, 20, 27, 0.34);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(2px);
    }
  </style>
  <script>
    (function () {
      var root = document.documentElement;
      var isMobile = window.matchMedia && window.matchMedia("(max-width: 760px)").matches;
      root.classList.add("chronohaze-critical-loading");
      if (isMobile) {
        root.classList.add("chronohaze-critical-loading-mobile");
      }
      window.__chronohazeReleaseCriticalLoader = function () {
        root.classList.remove("chronohaze-critical-loading");
        root.classList.remove("chronohaze-critical-loading-mobile");
      };
      window.setTimeout(window.__chronohazeReleaseCriticalLoader, isMobile ? 1500 : 6500);
    })();
  </script>
<script>
    (function () {
      try {
        var url = new URL(window.location.href);
        var queryLang = url.searchParams.get("lang");
        var valid = function (value) {
          return value === "zh" || value === "en";
        };
        var defaultLang = (document.documentElement.getAttribute("lang") || "").toLowerCase();
        var defaultSafe = defaultLang.indexOf("en") === 0 ? "en" : "zh";

        if (valid(queryLang)) {
          window.localStorage.setItem("siteLang", queryLang);
          window.localStorage.setItem("chronohaze-lang", queryLang);
          window.__chronohazePreferredLang = queryLang;
          document.documentElement.lang = queryLang === "en" ? "en" : "zh-CN";
          document.documentElement.setAttribute("data-site-lang", queryLang);
          return;
        }

        var storedLang = window.localStorage.getItem("siteLang");
        if (!valid(storedLang)) {
          storedLang = window.localStorage.getItem("chronohaze-lang");
        }
        if (!valid(storedLang)) {
          return;
        }

        window.__chronohazePreferredLang = storedLang;
        document.documentElement.lang = storedLang === "en" ? "en" : "zh-CN";
        document.documentElement.setAttribute("data-site-lang", storedLang);

        if (storedLang !== defaultSafe) {
          url.searchParams.set("lang", storedLang);
          window.location.replace(url.toString());
        }
      } catch (_err) {}
    })();
  </script>

<meta name="robots" content="noindex,follow" />
  <title>Redirecting to Policy | Chronohaze</title>
  <link rel="preload" href="assets/fonts/cormorant-garamond-roman-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.min.css?v=20260719-quality1" />
  <noscript><meta http-equiv="refresh" content="0; url=policy.html" /></noscript>
</head>
<body class="page-transition-busy">
  <div class="chronohaze-loader" aria-hidden="true">
    <div class="chronohaze-loader__veil"></div>
    <div class="chronohaze-loader__mist chronohaze-loader__mist--left"></div>
    <div class="chronohaze-loader__mist chronohaze-loader__mist--right"></div>
    <div class="chronohaze-loader__panel">
      <p class="chronohaze-loader__brand">chronohaze.space</p>
      <p class="chronohaze-loader__status">Switching</p>
      <h2 class="chronohaze-loader__title">Opening the next page</h2>
      <p class="chronohaze-loader__meta">Please wait a moment while the next page arrives.</p>
      <div class="chronohaze-loader__line" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <main style="position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px;">
    <p id="redirectFallbackPolicy" aria-live="polite" style="margin:0;color:rgba(232,234,237,0.72);font-family:var(--font-sans,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif);font-size:14px;">
      Redirecting to <a href="policy.html">Policy</a>…
    </p>
  </main>
  <script>
    (function () {
      var safeLang = window.__chronohazePreferredLang === 'en' ? 'en' : 'zh';
      if (safeLang !== 'en') {
        var langAttr = String(document.documentElement.getAttribute('lang') || '').toLowerCase();
        safeLang = langAttr.indexOf('en') === 0 ? 'en' : 'zh';
      }
      var copy = safeLang === 'en'
        ? {
            status: 'Switching',
            title: 'Opening the next page',
            meta: 'Please wait a moment while the next page arrives.',
            fallback: 'Redirecting to <a href="policy.html">Policy</a>…',
            lang: 'en'
          }
        : {
            status: '切换中',
            title: '正在切换页面',
            meta: '请稍候，下一页正在缓缓展开。',
            fallback: '正在前往<a href="policy.html">网站说明</a>…',
            lang: 'zh-CN'
          };
      var loader = document.querySelector('.chronohaze-loader');
      if (loader) {
        loader.setAttribute('lang', copy.lang);
        var statusNode = loader.querySelector('.chronohaze-loader__status');
        var titleNode = loader.querySelector('.chronohaze-loader__title');
        var metaNode = loader.querySelector('.chronohaze-loader__meta');
        if (statusNode) statusNode.textContent = copy.status;
        if (titleNode) titleNode.textContent = copy.title;
        if (metaNode) metaNode.textContent = copy.meta;
      }
      var fallback = document.getElementById('redirectFallbackPolicy');
      if (fallback) fallback.innerHTML = copy.fallback;
      var target = 'policy.html' + window.location.search + window.location.hash;
      window.setTimeout(function () {
        window.location.replace(target);
      }, 140);
    })();
  </script>
</body>
</html>
